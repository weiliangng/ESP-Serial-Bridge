[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; The bridge sketch is included from src/main.cpp, so declare the ESP32 core
; libraries explicitly for PlatformIO's dependency scanner.
lib_deps =
    ESPmDNS
    ESP32 Async UDP
    ArduinoOTA

; UART0 debug output is configured for 115200 baud in config.h.
monitor_speed = 115200
upload_speed = 460800
